<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <p>Unordered Lists:list and groups for better readability by bullets</p>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
    </ul>
    <p>Ordered Lists:List the Items by numbering them</p>
    <ol>
        <li>Laptop</li>
        <li>Phone</li>
        <li>ipad</li>
    </ol>
</body>
</html>
