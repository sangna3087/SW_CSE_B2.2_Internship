<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table 5</title>
</head>
<body>
    <h3>Colspan</h3>
    <table border="5">
        <tr>
            <th colspan="3">Student Details</th>
        </tr>
        <tr>
            <td colspan="2">Name</td>
            <td>Sangna</td>
        </tr>
        
        <tr>
            <td>Courses</td>
            <td>Full Stack</td>
            <td>Gen AI</td>
        </tr>
    </table>
    <h3>Rowspan</h3>
    <table border="2">
        <tr>
            <th rowspan="2">Day</th>
            <th>Morning</th>
            <th>Evening</th>
        </tr>
        <tr>
            <td>React JS Practice</td>
            <td>Backend Practice</td>
        </tr>

    </table>
    
</body>
</html>
