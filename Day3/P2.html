<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms 2</title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <p>Please fill out the form below:<br>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName"><br>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName"><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br>
        </fieldset>
        <fieldset>
            <p>Preferences</p>
            <p>Gender:</p>
            <input type="radio" name="gender" id="Male" value="Male"> <label for="Male">Male</label>
             <input type="radio" name="gender" id="Female" value="Female"> <label for="Female">Female</label>
        </p> 
        <p>
            Skills:<br>
            <input type="checkbox" name="skills" id="html" value="HTML">
            <label for="html">HTML</label>
            <input type="checkbox" name="skills" id="css" value="CSS">
            <label for="css">CSS</label>
            <input type="checkbox" name="skills" id="javascript" value="JavaScript">
            <label for="javascript">JavaScript</label>
        </p>  
        <p>
            <label for="country">Country:</label>
            <select name="country" id="country">
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
            </select> 
        </fieldset> 
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
