<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibling Selector</title>
    <style>
        h2+p{
            color: aquamarine;

        }
        input[type="text"]{
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            padding: 10px;
            border-radius: 5px;
        }
        input:focus{
            outline-color:2px, rgb(205, 31, 221);
        }
        a:hover{
            background-color: cadetblue;
        }
        p::first-letter{
            color: rgb(255, 0, 0);
            font-size: 100px;
        }
    </style>
</head>
<body>
    <h2>CSS Selectors</h2>
    <p>Sibling Selector:Select the element that is an immediate sibling of another element</p>
    <a href="#">Click here</a>
    <input type="text" id="email" placeholder="Email">
    
</body>
</html>
