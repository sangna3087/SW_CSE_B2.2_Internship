<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container{
            display: flex;
            border:2px solid rgb(201, 24, 83);
            gap: 10px;
            padding: 10px;
        }
        .item{
            background-color: rgb(93, 10, 75);
            color: rgb(249, 246, 244);
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <p>CSS Flexbox:is a one dimensional layout system designed to arrenge and aligned in a container,either in a row or column.It makes much easier to create responsive,flexible layouts without the complex positioning or floats.</p>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        

    </div>
    
</body>
</html>
