<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div and span tag</title>
    <style>
        .card {
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(83, 83, 174, 0.1);
            background-color: #7c70ca;
        }

        .highlight {
            color: rgb(11, 11, 11);
            font-weight: bold;
            background-color: rgb(130, 124, 221);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Product Card</h2>
        <p>The product is beautiful and the best part is <span class="highlight">ITS ON SALE</span></p>
    </div>
    
</body>
</html>
